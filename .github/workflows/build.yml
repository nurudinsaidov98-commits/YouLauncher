# Build and test on every push and pull request; the portable build is attached as a workflow artifact.
# Releases are published manually with YouLauncher-<version>-windows.zip: the launcher's auto-update looks for
# that asset and checks its sha256 (GitHub computes it for every release asset).
#
# Optional repository secret (Settings → Secrets and variables → Actions):
#   YOULAUNCHER_CURSEFORGE_KEY  CurseForge API key embedded into the build.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and portable build
        shell: pwsh
        env:
          YOULAUNCHER_CURSEFORGE_KEY: ${{ secrets.YOULAUNCHER_CURSEFORGE_KEY }}
          YOULAUNCHER_UPDATE_REPO: ${{ github.repository }}
        run: ./gradlew.bat test exportZip --no-daemon

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

      - uses: actions/upload-artifact@v4
        with:
          name: YouLauncher-windows
          path: YouLauncher-*-windows.zip
